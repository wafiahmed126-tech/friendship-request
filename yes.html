<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inshallah!</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0fdf4; /* Soft green background */
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        .message-box {
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { color: #166534; font-size: 2rem; }
        p { color: #374151; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="message-box">
        <h1>Inshallah! 🤲</h1>
        <p>This friendship won’t break again.</p>
        <span>✨ Best Friends Forever ✨</span>
    </div>
</body>
</html>
